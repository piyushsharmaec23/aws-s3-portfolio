name: Deploy Portfolio to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  S3_BUCKET: piyush-aws-s3-portfolio-2026

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::303278700506:role/GitHubActions-S3-Portfolio
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET }} --delete \
            --exclude ".git/*" \
            --exclude ".github/*"